packages:
  - "apps/*"
  - "packages/*"

overrides:
  # Security fixes for transitive dependencies; constrain overrides to the affected major.
  fast-uri: 3.1.7
  "js-yaml@3": 3.15.2
  "js-yaml@4": 4.3.2
  "nanoid@3": 3.3.19
  "postcss@8": 8.5.23
  "qs@6": 6.16.0
  "hono@4": 4.13.5
  "sharp@0.34": 0.35.4
  # react-d3-tree uses the v4 export, which remains compatible in UUID 11 (including CJS).
  "react-d3-tree>uuid": 11.1.1

packageExtensions:
  "@sentry/react-router@10.69.0":
    # Its exported plugin types import Vite, but the package omits this peer.
    peerDependencies:
      vite: "^7.0.0"
  "@hookform/resolvers@5.2.2":
    peerDependencies:
      zod: "^3.25.0 || ^4.0.0"
  "remix-themes@2.0.4":
    peerDependencies:
      react: "^19.2.8"
