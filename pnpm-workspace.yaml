packages:
  - "apps/*"
  - "packages/*"

overrides:
  # Express 4 requests ~6.15.1; patched qs releases start at 6.16.1.
  "qs@6": ^6.16.1

packageExtensions:
  "remix-themes@2.0.4":
    peerDependencies:
      react: "^19.2.8"

peerDependencyRules:
  allowedVersions:
    # Validated React rules through @eslint/compat; remove when upstream supports ESLint 10.
    "eslint-plugin-react@7.37.5>eslint": "10.13.0"

# Use esbuild's packaged platform binaries, as before this migration.
allowBuilds:
  esbuild: false
