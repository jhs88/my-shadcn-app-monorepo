# The package.json remains the adapter to Maven during coexistence.
stack: "backend"
layer: "application"
tags: ["java", "spring"]

tasks:
  build:
    command: "pnpm run build"
    deps: ["^:build"]
    outputs: ["target/**/*"]
  clean:
    command: "pnpm run clean"
    options:
      cache: false
      runInCI: false