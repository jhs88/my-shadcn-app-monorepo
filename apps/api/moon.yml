stack: "backend"
layer: "application"
tags: ["node", "express"]

tasks:
  dev:
    command: "pnpm run dev"
    deps: ["^:build"]
    options:
      cache: false
      persistent: true
      runInCI: false
  build:
    command: "pnpm run build"
    deps: ["^:build"]
    inputs:
      - "**/*"
      - "$JAVA_API_HOST"
      - "$PORT"
    outputs: ["dist/**/*"]
  clean:
    command: "pnpm run clean"
    options:
      cache: false
      runInCI: false
  lint:
    command: "pnpm run lint"
    deps: ["^:build"]
    options:
      runInCI: true
  test:
    command: "pnpm run test"
    deps: ["^:build"]
