name: Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - "main"
      - "releases/v*"
    tags:
      - "v*"
  # pull_request:
  #   branches:
  #     - "mair"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  packages: write
  attestations: write
  id-token: write

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}

jobs:
  build-and-push:
    name: 📦 Build & Deploy Containers
    runs-on: my-shadcn-app-monorepo
    strategy:
      fail-fast: false
      matrix:
        target: [api, java-api, web, react-router-web]
    steps:
      - name: Validate frontend build configuration
        if: matrix.target == 'web' || matrix.target == 'react-router-web'
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          test -n "$SUPABASE_URL" || { echo "::error::Configure the SUPABASE_URL repository variable"; exit 1; }
          test -n "$SUPABASE_ANON_KEY" || { echo "::error::Configure the SUPABASE_ANON_KEY repository secret (public anon key)"; exit 1; }
      - name: ⬇️ Checkout repo
        uses: actions/checkout@v4

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔐 Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🔧 Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository }}/${{ matrix.target }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=tag
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha

      - name: 🚀 Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          build-args: |
            SUPABASE_URL=${{ vars.SUPABASE_URL }}
            SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
            "TURBO_API=${{ vars.TURBO_API }}"
            "TURBO_TEAM=${{ vars.TURBO_TEAM }}"
            "TURBO_TELEMETRY_DISABLED=${{ vars.TURBO_TELEMETRY_DISABLED }}"
          secret-envs: |
            "turbo_token=TURBO_TOKEN"
          file: apps/${{ matrix.target }}/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

