name: Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  packages: write
  attestations: write
  id-token: write

env: # To use Turborepo Remote Caching, set the following environment variables for the job.
  TURBO_TELEMETRY_DISABLED: ${{ vars.TURBO_TELEMETRY_DISABLED }}
  TURBO_API: ${{ vars.TURBO_API }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}

jobs:
  release:
    name: 🦋 Changesets Release
    runs-on: my-shadcn-app-monorepo
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: 📚 Cache turbo build setup
        uses: actions/cache@v5
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v6.1.0

      - name: ⎔ Setup node
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: 📥 Install deps
        run: pnpm install --frozen-lockfile

      - name: 🚀 PR / Publish
        id: changesets
        uses: changesets/action@v2.1.2
        with:
          # This expects you to have a script called release which does a build for your packages and calls changeset publish
          publish-script: pnpm release
          version-script: pnpm version-packages
          push-with-git-cli: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
